<div class="wishlist-page container">
  <header class="wishlist-header">
    <h1><i class="bi bi-heart-fill"></i> Mi Lista de Deseos</h1>
    <p class="text-muted">Guarda aquí tus productos favoritos para comprarlos después.</p>
  </header>

  <div *ngIf="favoriteProducts.length === 0" class="empty-wishlist text-center">
    <div class="empty-icon-wrapper">
      <i class="bi bi-heartbroken"></i>
    </div>
    <h2>Tu lista está vacía</h2>
    <p>¿Aún no has agregado tus favoritos? Explora nuestra tienda completa.</p>
    <a routerLink="/productos" class="btn-explore">Explorar Productos</a>
  </div>

  <div *ngIf="favoriteProducts.length > 0" class="wishlist-grid">
    <div *ngFor="let item of favoriteProducts" class="wishlist-card">

      <button class="btn-remove" (click)="removeItem(item)" title="Quitar de favoritos">
        <i class="bi bi-x"></i>
      </button>

      <div class="card-image-wrapper" [routerLink]="['/producto', item.idProducto]">
        <img [src]="item.imagen && item.imagen !== 'img' ? (item.imagen.startsWith('http') ? item.imagen : 'assets/productos/' + item.imagen) : 'assets/p1.jpg'"
             [alt]="item.nombre"
             class="wishlist-img">
      </div>

      <div class="card-details">
        <span class="category-badge">{{ item.categoria?.nombre || 'General' }}</span>

        <h3 class="product-name" [routerLink]="['/producto', item.idProducto]">{{ item.nombre }}</h3>

        <div class="price-section">
          <span class="price-value">S/ {{ item.precio | number:'1.2-2' }}</span>
        </div>

        <div class="card-actions">
          <button
            class="btn-add-to-cart"
            (click)="addToCart(item)"
            [disabled]="item.stock === 0"> <i class="bi" [ngClass]="item.stock > 0 ? 'bi-lightning-fill' : 'bi-dash-circle'"></i>
            {{ item.stock > 0 ? 'Comprar Ahora' : 'Agotado' }}
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
