@if (metodoSeleccionado === 'TARJETA_CREDITO') {
  <div class="card-form animate-fadeInUp">
    <h5 class="form-section-title">Pago con Tarjeta de Crédito/Débito</h5>

    <div class="p-4 mb-3 border rounded bg-white shadow-sm">

      <!-- Logo y título -->
      <div class="text-center mb-3">
        <img src="assets/mercadopago-logo.png"
             alt="Mercado Pago" style="max-height: 60px; object-fit: contain;">
        <h6 class="fw-bold text-dark mt-2">Pasarela Certificada por Mercado Pago</h6>
        <p class="text-muted small">Serás redirigido al checkout seguro de Mercado Pago</p>
      </div>

      <hr>

      <!-- Métodos aceptados -->
      <p class="text-center text-muted small fw-bold mb-2">MÉTODOS DE PAGO ACEPTADOS</p>
      <div class="d-flex justify-content-center gap-3 mb-3">
        <img src="assets/visa-logo.png" alt="Visa" style="height:28px;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg"
             alt="Mastercard" style="height:28px;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/30/American_Express_logo.svg"
             alt="Amex" style="height:28px;">
        <img src="assets/yape-logo.png" alt="Visa" style="height:28px;">
      </div>

      <hr>

      <!-- Seguridad -->
      <div class="d-flex justify-content-center gap-4 text-muted small mt-2">
        <span><i class="bi bi-shield-lock-fill text-success me-1"></i>Pago 100% seguro</span>
        <span><i class="bi bi-lock-fill text-success me-1"></i>Encriptación SSL</span>
        <span><i class="bi bi-patch-check-fill text-success me-1"></i>Datos protegidos</span>
      </div>
    </div>

    <div class="text-center mt-4">
      <button class="btn-pay" [disabled]="procesando" (click)="confirmarPago()">
        @if (!procesando) {
          <span><i class="bi bi-lock-fill me-2"></i>Pagar Ahora S/ {{ totalPedido | number:'1.2-2' }}</span>
        } @else {
          <div class="spinner-border spinner-border-sm text-light" role="status"></div>
          <span class="ms-2">Redirigiendo...</span>
        }
      </button>
    </div>

  </div>
}
