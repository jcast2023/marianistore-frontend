services:
  # 1. LA BASE DE DATOS
  db-mysql:
    image: mysql:8.0-oracle
    container_name: techshop-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: techshop_db
    ports:
      - "3306:3306"
    volumes:

      - ./mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

  # 2. EL BACKEND
  backend-api:
    build: ../e-commerce
    image: techshop-backend
    container_name: techshop-api
    depends_on:
      - db-mysql
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-mysql:3306/techshop_db?createDatabaseIfNotExist=true&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
    restart: on-failure

  # 3. EL FRONTEND (Ya lo construiste en el disco C)
  frontend-web:
    build: .
    image: techshop-frontend
    container_name: techshop-web
    depends_on:
      - backend-api
    ports:
      - "81:80"
    volumes:
      # Formato: [Ruta en Windows]:[Ruta en el Contenedor]
      - ./src/assets/productos:/usr/share/nginx/html/assets/productos
