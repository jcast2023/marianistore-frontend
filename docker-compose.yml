version: '3.8'

services:
  # 1. BASE DE DATOS MySQL
  mysql:
    image: mysql:8.0
    container_name: tiendaonline-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tiendaonline_db
      MYSQL_USER: tiendaonline
      MYSQL_PASSWORD: tiendaonline123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tiendaonline-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-utiendaonline", "-ptiendaonline123"]
      timeout: 20s
      retries: 10

  # 2. BACKEND Spring Boot
  backend:
    build: ../e-commerce
    image: tiendaonline-backend
    container_name: tiendaonline-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tiendaonline_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: tiendaonline
      SPRING_DATASOURCE_PASSWORD: tiendaonline123
      JWT_SECRET: tiendaonline2024SecretKeyForJWTTokenGenerationInDocker
      JWT_EXPIRATION: 86400000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tiendaonline-network

  # 3. FRONTEND Angular
  frontend:
    build: .
    image: tiendaonline-frontend
    container_name: tiendaonline-frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - tiendaonline-network

volumes:
  mysql_data:
    driver: local

networks:
  tiendaonline-network:
    driver: bridge
